  description: statistical component of b-tagging uncertainty on b and c jets with corrections derived in QCD and ttbar enriched regions for fixed working points, separated by year.

CMS_btag_fixedWP_light_uncorrelated_(2016preVFP|2016postVFP|2017|2018|2023|2023BPix|2022|2022EE|2024|2025):
