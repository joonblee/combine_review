  description: NPS-26-009 muon identification efficiency uncertainty treated separately for the 2016 preVFP and postVFP detector periods, preserving the implemented per-period correlation model.

CMS_eff_m_trigger_(2016|2017|2018|2022|2022EE|2023|2023BPix):
