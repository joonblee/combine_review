  description: NPS-26-009 muon trigger efficiency uncertainty treated separately for the 2016 preVFP and postVFP detector periods, preserving the implemented per-period correlation model.

CMS_pileup_(2016preVFP|2016postVFP|2017|2018|2022|2022EE|2023|2023BPix|2024|2025):
  class: pileup
