  description: NPS-26-009 muon momentum scale uncertainty treated separately for the 2016 preVFP and postVFP detector periods, preserving the implemented per-period correlation model.

QCDscale_fac_(ttbar|V|Vgamma|VV|WW|VVV|ggH|qqH|VH|ttH|bbH|ggVV|ggWW):
  class: qcd_scale
  description: uncertainty from variation of the QCD factorization scale in the given process.

QCDscale_ren_(ttbar|V|Vgamma|VV|WW|VVV|ggH|qqH|VH|ttH|bbH|ggVV|ggWW):
  class: qcd_scale
  description: uncertainty from variation of the QCD renormalization scale in the given process.

pdf_alphas:
  class: pdf
  description: PDF uncertainty associated with the variation of alpha_s.

CMS_NPS26009_lumi_(2016|2017|2018|2022|2023):
  class: custom
  description: integrated-luminosity normalization uncertainty used in NPS-26-009. The 2016 nuisance is shared by 2016preVFP and 2016postVFP; the 2022 nuisance is shared by 2022 and 2022EE; the 2023 nuisance is shared by 2023 and 2023BPix.

CMS_NPS26009_topmass_ttbar_BJetOS:
  class: custom
  description: asymmetric ttbar normalization uncertainty from the dependence of the NNLO+NNLL reference cross section on the assumed top-quark mass. One nuisance is shared across Run 2 and Run 3 with energy-dependent responses.

CMS_l1_prefiring_(2016preVFP|2016postVFP|2017|2018):
  class: custom
  description: L1 ECAL/muon prefiring correction uncertainty from the NanoAOD L1PreFiringWeight Up/Down variations, treated independently by data-taking period.

CMS_NPS26009_btag_fixedWP_(bc|light)_correlated_(13TeV|13p6TeV):
  class: custom
  description: correlated component of the DeepJet fixed-working-point b-tagging uncertainty. Heavy-flavour and light-flavour components are separate; the 13TeV component is shared within Run 2 and the 13p6TeV component is shared within Run 3.

CMS_NPS26009_bckgNorm_QCD_BJetOS_(2016preVFP|2016postVFP|2017|2018|2022|2022EE|2023|2023BPix):
  class: custom
  description: data-driven QCD normalization uncertainty from the OS-to-SS normalization procedure, treated independently by data-taking period.

CMS_NPS26009_bckgShape_QCD_BJetOS_(2016preVFP|2016postVFP|2017|2018|2022|2022EE|2023|2023BPix):
  class: custom
  description: QCD analytic functional-form uncertainty propagated as an additive Gaussian uncertainty on the absolute QCD yield through a constrained rateParam, treated independently by data-taking period.

CMS_NPS26009_NFStat_DY_BJetOS_(2016preVFP|2016postVFP|2017|2018|2022|2022EE|2023|2023BPix):
  class: custom
  description: statistical uncertainty in the constant normalization factor used for the data-driven Drell-Yan estimate, treated independently by data-taking period.

CMS_NPS26009_LightJetStat_DY_BJetOS_(2016preVFP|2016postVFP|2017|2018|2022|2022EE|2023|2023BPix):
  class: custom
  description: finite-statistics uncertainty of the light-jet control-region input to the data-driven Drell-Yan estimate, treated independently by data-taking period.

CMS_NPS26009_MCstat_(signal|ttbar|singleTop|other)_BJetOS_(2016preVFP|2016postVFP|2017|2018|2022|2022EE|2023|2023BPix):
  class: custom
  description: finite simulated-sample statistical uncertainty for the indicated process and data-taking period. These nuisance parameters are independent between processes and periods.

CMS_NPS26009_pdf_NNPDF31:
  class: custom
  description: PDF uncertainty for ttbar and single-top backgrounds obtained from the NNPDF31_nnlo_as_0118_mc_hessian_pdfas error members and propagated through the selected counting window.

CMS_NPS26009_QCDscale_(fac|ren)_singleTop:
  class: custom
  description: factorization- or renormalization-scale uncertainty for the single-top background, correlated across data-taking periods for the single-top process and independent of the corresponding ttbar scale nuisance.
